<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Plan Nutricional — WebApp</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/login.css">
</head>
<body class="bg-light">

  <!-- Login view container (hidden by default, shown on unauthenticated) -->
  <div id="loginViewContainer" class="d-none"></div>

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
      <span class="navbar-brand">Plan Nutricional</span>
      <div class="ms-auto d-flex gap-2 align-items-center">
        <select id="viewSelect" class="form-select form-select-sm">
          <option value="calendar">Calendario</option>
          <option value="table">Tabla</option>
          <option value="meals">Desayuno/Comida/Cena/Merienda</option>
          <option value="help">Ayuda</option>
          <option value="options">Opciones</option>
        </select>
        <input id="monthPicker" type="month" class="form-control form-control-sm" />
        <div class="dropdown ms-2" id="userDropdownContainer" style="display:none;">
          <button class="btn btn-outline-light btn-sm dropdown-toggle" type="button" id="userDropdown" data-bs-toggle="dropdown" aria-expanded="false">
            <span id="userDropdownName">Usuario</span>
          </button>
          <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userDropdown">
            <li><a class="dropdown-item" href="#" id="profileOption">Perfil</a></li>
            <li><hr class="dropdown-divider"></li>
            <li><a class="dropdown-item text-danger" href="#" id="logoutOption">Cerrar sesión</a></li>
          </ul>
        </div>
      </div>
    </div>
  </nav>

  <main class="container py-3">
    <div id="alerts"></div>

    <!-- Header -->
    <div class="d-flex align-items-center justify-content-between mb-3">
      <div>
        <h1 class="h4 mb-0">Registro diario</h1>
        <div class="text-secondary small" id="subtitle"></div>
      </div>
      <div class="d-flex gap-2">
        <button id="exportBtn" class="btn btn-outline-secondary btn-sm">Exportar JSON</button>
        <label class="btn btn-outline-secondary btn-sm mb-0">
          Importar JSON <input id="importInput" type="file" accept="application/json" hidden>
        </label>
        <button id="resetBtn" class="btn btn-outline-danger btn-sm">Reset</button>
      </div>
    </div>

    <!-- Views -->
    <section id="view-calendar" class="view"></section>
    <section id="view-table" class="view d-none"></section>
    <section id="view-meals" class="view d-none"></section>
    <section id="view-help" class="view d-none"></section>
    <section id="view-options" class="view d-none"></section>

    <!-- Modal day editor -->
    <div class="modal fade" id="dayModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-lg modal-dialog-scrollable">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="dayModalTitle">Día</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
          </div>
          <div class="modal-body">
            <div class="row g-3" id="dayEditor"></div>
          </div>
          <div class="modal-footer">
            <button id="saveDayBtn" type="button" class="btn btn-primary">Guardar</button>
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Modal meal adder (independiente) -->
    <div class="modal fade" id="mealAdderModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="mealAdderModalTitle">Agregar opción</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
          </div>
          <div class="modal-body" id="mealAdderModalBody"></div>
          <div class="modal-footer" id="mealAdderModalFooter"></div>
        </div>
      </div>

      </div>

      <!-- Modal for editing/adding meal options -->
      <div class="modal fade" id="optionEditModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
          <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-title" id="optionEditModalTitle">Edit Option</h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
            </div>
            <div class="modal-body" id="optionEditModalBody"></div>
            <div class="modal-footer" id="optionEditModalFooter"></div>
          </div>
        </div>
      </div>

    </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="src/login.js"></script>
  <script type="module" src="src/app.js"></script>
</body>
</html>
