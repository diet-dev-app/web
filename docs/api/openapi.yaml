openapi: 3.0.3
info:
  title: Diet API
  description: |
    REST API for the Diet management application.

    ## Authentication
    Most endpoints require a **JWT Bearer token**.
    1. Register a user via `POST /api/register`
    2. Obtain a token via `POST /api/login`
    3. Pass the token in every protected request as:
       ```
       Authorization: Bearer <token>
       ```

    ## Base URL
    `http://localhost` (or your deployed domain)

  version: "1.0.0"
  contact:
    name: Diet Dev Team

servers:
  - url: http://localhost
    description: Local Docker environment

tags:
  - name: Auth
    description: Registration & login
  - name: User
    description: Authenticated user profile
  - name: Meals
    description: Daily meal plans for the current user
  - name: Meal Options
    description: Catalogue of reusable meal option templates (with ingredients)
  - name: Shopping List
    description: AI-generated shopping list based on planned meals

# ---------------------------------------------------------------------------
# Security scheme
# ---------------------------------------------------------------------------
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  # ---------------------------------------------------------------------------
  # Reusable schemas
  # ---------------------------------------------------------------------------
  schemas:

    # ── Auth ─────────────────────────────────────────────────────────────────
    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          format: password
          minLength: 6
          example: secret123
        name:
          type: string
          example: Carlos

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          format: password
          example: secret123

    LoginResponse:
      type: object
      properties:
        token:
          type: string
          description: JWT access token (valid for 1 hour by default)
          example: eyJ0eXAiOiJKV1QiLCJhbGciOiJSUzI1NiJ9...

    # ── User ─────────────────────────────────────────────────────────────────
    UserProfile:
      type: object
      properties:
        id:
          type: integer
          example: 1
        email:
          type: string
          example: user@example.com
        name:
          type: string
          nullable: true
          example: Carlos
        createdAt:
          type: string
          format: date-time
          example: "2026-02-15T10:00:00+00:00"
        isActive:
          type: boolean
          example: true
        roles:
          type: array
          items:
            type: string
          example: ["ROLE_USER"]

    # ── Ingredients ──────────────────────────────────────────────────────────
    Ingredient:
      type: object
      properties:
        id:
          type: integer
          example: 42
        name:
          type: string
          example: Chicken breast
        quantity:
          type: number
          format: float
          example: 150.0
        unit:
          type: string
          example: g

    IngredientInput:
      type: object
      required: [name, quantity, unit]
      properties:
        name:
          type: string
          example: Chicken breast
        quantity:
          type: number
          format: float
          example: 150.0
        unit:
          type: string
          example: g

    # ── MealTime ─────────────────────────────────────────────────────────────
    MealTime:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: breakfast
        label:
          type: string
          example: Breakfast

    # ── MealOption ───────────────────────────────────────────────────────────
    MealOption:
      type: object
      properties:
        id:
          type: integer
          example: 10
        name:
          type: string
          example: Oatmeal with banana
        description:
          type: string
          nullable: true
          example: A healthy breakfast option
        estimated_calories:
          type: number
          format: float
          nullable: true
          example: 320.0
        meal_time:
          $ref: '#/components/schemas/MealTime'
        ingredients:
          type: array
          items:
            $ref: '#/components/schemas/Ingredient'

    MealOptionCreateRequest:
      type: object
      required: [name, meal_time_id]
      properties:
        name:
          type: string
          example: Oatmeal with banana
        description:
          type: string
          nullable: true
          example: A healthy breakfast option
        meal_time_id:
          type: integer
          example: 1
          description: ID of the MealTime (1=breakfast, 2=lunch, 3=snack, 4=dinner)
        estimated_calories:
          type: number
          format: float
          nullable: true
          example: 320.0
        ingredients:
          type: array
          items:
            $ref: '#/components/schemas/IngredientInput'

    MealOptionUpdateRequest:
      type: object
      properties:
        name:
          type: string
          example: Oatmeal with strawberries
        description:
          type: string
          nullable: true
        meal_time_id:
          type: integer
          example: 1
        estimated_calories:
          type: number
          format: float
          nullable: true
          example: 300.0
        ingredients:
          type: array
          description: Replaces the full ingredient list when provided
          items:
            $ref: '#/components/schemas/IngredientInput'

    # ── Meals ─────────────────────────────────────────────────────────────────
    MealTimeWithOptions:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: breakfast
        label:
          type: string
          example: Breakfast
        options:
          type: array
          items:
            $ref: '#/components/schemas/MealOptionInMeal'

    MealOptionInMeal:
      type: object
      properties:
        id:
          type: integer
          example: 10
        name:
          type: string
          example: Oatmeal with banana
        description:
          type: string
          nullable: true
        estimated_calories:
          type: number
          nullable: true
        ingredients:
          type: array
          items:
            $ref: '#/components/schemas/Ingredient'

    Meal:
      type: object
      properties:
        id:
          type: integer
          example: 5
        name:
          type: string
          example: Monday plan
        calories:
          type: integer
          example: 1800
        date:
          type: string
          format: date-time
          example: "2026-02-22T00:00:00+00:00"
        notes:
          type: string
          nullable: true
          example: Cheat day – keep dinner light
        meal_times:
          type: array
          description: Meal options grouped by meal time (breakfast, lunch, snack, dinner)
          items:
            $ref: '#/components/schemas/MealTimeWithOptions'

    MealCreateRequest:
      type: object
      required: [date]
      properties:
        date:
          type: string
          format: date
          example: "2026-02-22"
        name:
          type: string
          example: Monday plan
        calories:
          type: integer
          example: 1800
        notes:
          type: string
          nullable: true
          example: Cheat day – keep dinner light
        meal_option_ids:
          type: array
          description: IDs of existing MealOptions to attach to this Meal
          items:
            type: integer
          example: [10, 11, 12]

    MealUpdateRequest:
      type: object
      properties:
        name:
          type: string
          example: Monday plan (updated)
        calories:
          type: integer
          example: 2000
        date:
          type: string
          format: date
          example: "2026-02-23"
        notes:
          type: string
          nullable: true

    MealSimple:
      type: object
      description: Simplified meal response (returned on create / update)
      properties:
        id:
          type: integer
          example: 5
        name:
          type: string
          example: Monday plan
        calories:
          type: integer
          example: 1800
        date:
          type: string
          format: date-time
          example: "2026-02-22T00:00:00+00:00"
        notes:
          type: string
          nullable: true

    # ── Shopping list ─────────────────────────────────────────────────────────
    ShoppingListItem:
      type: object
      properties:
        name:
          type: string
          example: Chicken breast
        quantity:
          type: string
          example: "300g"
        category:
          type: string
          example: Protein

    ShoppingListResponse:
      type: object
      properties:
        shopping_list:
          type: array
          items:
            $ref: '#/components/schemas/ShoppingListItem'
        notes:
          type: string
          nullable: true
          example: "Buy organic eggs if possible"

    # ── Generic ──────────────────────────────────────────────────────────────
    MessageResponse:
      type: object
      properties:
        message:
          type: string
          example: Operation successful

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          example: Unauthorized

    ValidationErrorResponse:
      type: object
      properties:
        errors:
          type: object
          additionalProperties:
            type: string
          example:
            email: This value is not a valid email address.

# ---------------------------------------------------------------------------
# Paths
# ---------------------------------------------------------------------------
paths:

  # ── Healthcheck ────────────────────────────────────────────────────────────
  /:
    get:
      tags: [Auth]
      summary: API health check
      description: Returns basic status information. No authentication required.
      operationId: healthCheck
      responses:
        '200':
          description: API is running
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: API Diet is running
                  status:
                    type: string
                    example: ok
                  timestamp:
                    type: string
                    format: date-time

  # ── Auth ───────────────────────────────────────────────────────────────────
  /api/register:
    post:
      tags: [Auth]
      summary: Register a new user
      description: Creates a new user account. No authentication required.
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: User registered successfully
        '400':
          description: Missing fields or validation error
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorResponse'
                  - $ref: '#/components/schemas/ValidationErrorResponse'

  /api/login:
    post:
      tags: [Auth]
      summary: Login and obtain JWT token
      description: |
        Authenticates the user with email/password and returns a signed JWT token.
        The token must be included in the `Authorization: Bearer <token>` header
        for all protected endpoints.
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Invalid credentials.

  # ── User ───────────────────────────────────────────────────────────────────
  /api/user:
    get:
      tags: [User]
      summary: Get current user profile
      description: Returns the profile of the currently authenticated user.
      operationId: getUserProfile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ── Meals ──────────────────────────────────────────────────────────────────
  /api/meals:
    get:
      tags: [Meals]
      summary: List user's meals
      description: |
        Returns all meals belonging to the authenticated user.
        Each meal includes its associated meal options grouped by meal time
        (breakfast, lunch, snack, dinner), with their ingredient lists.
      operationId: listMeals
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of meals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Meal'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      tags: [Meals]
      summary: Create a new meal
      description: |
        Creates a meal day entry for the authenticated user.
        You can optionally attach existing `MealOption` IDs.
      operationId: createMeal
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MealCreateRequest'
            example:
              date: "2026-02-22"
              name: Monday plan
              calories: 1800
              notes: Light dinner
              meal_option_ids: [10, 11]
      responses:
        '201':
          description: Meal created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MealSimple'
        '400':
          description: Missing required field or validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/meals/{id}:
    put:
      tags: [Meals]
      summary: Update a meal
      description: Updates the editable fields of a meal belonging to the authenticated user.
      operationId: updateMeal
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          example: 5
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MealUpdateRequest'
      responses:
        '200':
          description: Meal updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MealSimple'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Meal not found or does not belong to user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      tags: [Meals]
      summary: Delete a meal
      description: Permanently deletes a meal belonging to the authenticated user.
      operationId: deleteMeal
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          example: 5
      responses:
        '200':
          description: Meal deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: Meal deleted
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Meal not found or does not belong to user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ── Meal Options ───────────────────────────────────────────────────────────
  /api/meal-options:
    get:
      tags: [Meal Options]
      summary: List all meal options
      description: |
        Returns the full catalogue of meal options (templates).
        Each option includes its associated meal time and ingredient list.
        Requires authentication.
      operationId: listMealOptions
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of meal options
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MealOption'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      tags: [Meal Options]
      summary: Create a meal option
      description: |
        Creates a new meal option template with associated ingredients.
        `meal_time_id` references a MealTime record (e.g. 1=Breakfast, 2=Lunch, 3=Snack, 4=Dinner).
      operationId: createMealOption
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MealOptionCreateRequest'
            example:
              name: Oatmeal with banana
              description: High-fibre breakfast
              meal_time_id: 1
              estimated_calories: 320
              ingredients:
                - name: Rolled oats
                  quantity: 80
                  unit: g
                - name: Banana
                  quantity: 1
                  unit: unit
                - name: Almond milk
                  quantity: 200
                  unit: ml
      responses:
        '201':
          description: Meal option created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MealOption'
        '400':
          description: Missing required field or invalid ingredient data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: MealTime not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/meal-options/{id}:
    put:
      tags: [Meal Options]
      summary: Update a meal option
      description: |
        Updates an existing meal option. All fields are optional.
        When `ingredients` is provided, it **replaces** the full ingredient list.
      operationId: updateMealOption
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          example: 10
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MealOptionUpdateRequest'
      responses:
        '200':
          description: Meal option updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MealOption'
        '400':
          description: Invalid ingredient data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: MealOption or MealTime not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      tags: [Meal Options]
      summary: Delete a meal option
      description: Permanently deletes a meal option and its ingredients.
      operationId: deleteMealOption
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          example: 10
      responses:
        '200':
          description: Meal option deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: MealOption deleted
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: MealOption not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ── Shopping List ──────────────────────────────────────────────────────────
  /api/shopping-list:
    get:
      tags: [Shopping List]
      summary: Generate AI shopping list
      description: |
        Uses OpenAI to generate a consolidated shopping list based on all meals
        the authenticated user has planned within the given date range.

        The AI analyses every meal option's ingredients and returns a cleaned,
        categorised shopping list with consolidated quantities.

        **Date format:** `YYYY-MM-DD`
      operationId: getShoppingList
      security:
        - bearerAuth: []
      parameters:
        - name: start
          in: query
          required: true
          description: Start date (inclusive) of the date range
          schema:
            type: string
            format: date
          example: "2026-02-17"
        - name: end
          in: query
          required: true
          description: End date (inclusive) of the date range
          schema:
            type: string
            format: date
          example: "2026-02-23"
      responses:
        '200':
          description: AI-generated shopping list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShoppingListResponse'
              example:
                shopping_list:
                  - name: Chicken breast
                    quantity: "600g"
                    category: Protein
                  - name: Rolled oats
                    quantity: "400g"
                    category: Grains
                  - name: Banana
                    quantity: "5 units"
                    category: Fruit
                notes: "Consider buying organic eggs."
        '400':
          description: Missing start or end date
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Missing start or end date
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No meals found for the given date range
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: No meals found for this range
